apiVersion: v1
kind: Service
metadata:
  name: hello-gitops
  namespace: hello-gitops
spec:
  type: NodePort
  selector:
    app: hello-gitops
  ports:
    - port: 80
      targetPort: 80
      # Fixed so the URL is predictable (http://<any-node-ip>:30081),
      # matching how vproapp does it at :30080 in the vprofile stack.
      nodePort: 30081
